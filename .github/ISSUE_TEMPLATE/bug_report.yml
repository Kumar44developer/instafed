name: Bug report
description: Something in Instafeed does not behave the way it should
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more context you give,
        the faster we can fix it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I click "Sync now" the feed stays empty and the console shows…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: The feed should show the 10 newest reels from @nasa.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1. Sign in as a new account
        2. Subscribe to @nasa
        3. Click "Sync now"
        4. Observe …
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the output of `GET /api/health`.
      placeholder: |
        OS: Windows 11
        Python: 3.12.4
        Instafeed: 2.0.0
        Docker: yes / no
      render: shell
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error output or logs
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and this has not been reported yet
          required: true
        - label: I am using the latest version
          required: false
